services:
  backend:
    build:
      context: ./app_hernia
      dockerfile: Dockerfile.backend
    expose:
      - "8000"

  frontend:
    build:
      context: ./app_hernia
      dockerfile: Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "80:5000"
    environment:
      - BACKEND_URL=http://backend:8000
